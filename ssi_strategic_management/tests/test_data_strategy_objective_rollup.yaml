        save_as: "kpi_parent_m"
        as_user: "validator"
        values:
          target_id: "REC: kpi_parent_t.id"
          date: 2026-02-15
          manual_value: 80.0
      - step: "Create KPI kpi_child"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_child"
        as_user: "validator"
        values:
          objective_id: "REC: child.id"
          measure_id: "REC: measure_high.id"
          name: "kpi_child"
          weight: 100.0
      - step: "Create target of kpi_child"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "kpi_child_t"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_child.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement of kpi_child"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "kpi_child_m"
        as_user: "validator"
        values:
          target_id: "REC: kpi_child_t.id"
          date: 2026-02-15
          manual_value: 20.0
      - step: "Active child shares the portion"
        action: "assert"
        target: "parent"
        asserts:
          kpi_portion:
            type: "value"
            expected: 50.0
          child_score:
            type: "value"
            expected: 20.0
          score:
            type: "value"
            expected: 50.0
      - step: "Cancel the only child"
        action: "call"
        target: "child"
        method: "action_cancel"
        as_user: "validator"
        context:
          bypass_policy_check: true
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "cancel"
      - step: "Parent is treated as having no child"
        action: "assert"
