setup:
  steps:
    - step: "Create validator user"
      action: "create"
      model: "res.users"
      save_as: "validator"
      values:
        name: "Strategy Rollup Validator"
        login: "EVAL: 'rlv%s' % datetime.now().strftime('%H%M%S%f')"
        groups_id:
          - [
              6,
              0,
              [
                "REF: base.group_user",
                "REF: ssi_strategic_management.strategy_plan_validator_group",
                "REF: ssi_strategic_management.strategy_objective_validator_group",
                "REF: ssi_strategic_management.strategy_measure_group",
              ],
            ]
    - step: "Create department"
      action: "create"
      model: "hr.department"
      save_as: "dept"
      values:
        name: "Rollup Department"
    - step: "Create score category"
      action: "create"
      model: "strategy_score_category"
      save_as: "category"
      values:
        name: "Rollup score category"
        code: "EVAL: 'RC%s' % datetime.now().strftime('%H%M%S%f')"
        range_ids:
          - [0, 0, {name: "Poor", min_value: 0.0, max_value: 60.0, sequence: 10}]
          - [0, 0, {name: "Good", min_value: 60.01, max_value: 100.0, sequence: 20}]
    - step: "Create Balanced Scorecard plan type without category"
      action: "create"
      model: "strategy_plan_type"
      save_as: "type_bsc"
      as_user: "base.user_admin"
      values:
        name: "Rollup plan type bsc"
        code: "EVAL: 'RB%s' % datetime.now().strftime('%H%M%S%f')"
        methodology: "bsc"
        cascade_level: "department"
    - step: "Create Balanced Scorecard plan type with category"
      action: "create"
      model: "strategy_plan_type"
      save_as: "type_cat"
      as_user: "base.user_admin"
      values:
        name: "Rollup plan type category"
        code: "EVAL: 'RT%s' % datetime.now().strftime('%H%M%S%f')"
        methodology: "bsc"
        cascade_level: "department"
        score_category_id: "REC: category.id"
    - step: "Create OKR plan type"
      action: "create"
      model: "strategy_plan_type"
      save_as: "type_okr"
      as_user: "base.user_admin"
      values:
        name: "Rollup plan type okr"
        code: "EVAL: 'RO%s' % datetime.now().strftime('%H%M%S%f')"
        methodology: "okr"
        score_scale: "okr"
        cascade_level: "department"
    - step: "Create Balanced Scorecard plan"
      action: "create"
      model: "strategy_plan"
      save_as: "plan_bsc"
      as_user: "validator"
      values:
        type_id: "REC: type_bsc.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
    - step: "Create OKR plan under it"
      action: "create"
      model: "strategy_plan"
      save_as: "plan_okr"
      as_user: "validator"
      values:
        type_id: "REC: type_okr.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
        parent_id: "REC: plan_bsc.id"
    - step: "Create plan with a score category"
      action: "create"
      model: "strategy_plan"
      save_as: "plan_cat"
      as_user: "validator"
      values:
        type_id: "REC: type_cat.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
    - step: "Create higher is better measure"
      action: "create"
      model: "strategy_measure"
      save_as: "measure_high"
      as_user: "validator"
      values:
        name: "Rollup measure higher"
        code: "EVAL: 'RM%s' % datetime.now().strftime('%H%M%S%f')"
        polarity: "higher"
        aggregation: "sum"

scenarios:
  - name: "Objective with KPIs only takes the KPI score"
    steps:
      - step: "Create objective objective"
        action: "create"
        model: "strategy_objective"
        save_as: "objective"
        as_user: "validator"
        values:
          plan_id: "REC: plan_bsc.id"
          department_id: "REC: dept.id"
          perspective_id: "REF: ssi_strategic_management.strategy_perspective_financial"
      - step: "Create KPI kpi_a"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_a"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "kpi_a"
          weight: 50.0
      - step: "Create target of kpi_a"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "kpi_a_t"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_a.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement of kpi_a"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "kpi_a_m"
        as_user: "validator"
        values:
          target_id: "REC: kpi_a_t.id"
          date: 2026-02-15
          manual_value: 80.0
      - step: "Create KPI kpi_b"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_b"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "kpi_b"
          weight: 50.0
      - step: "Create target of kpi_b"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "kpi_b_t"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_b.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement of kpi_b"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "kpi_b_m"
        as_user: "validator"
        values:
          target_id: "REC: kpi_b_t.id"
          date: 2026-02-15
          manual_value: 60.0
      - step: "KPI portion defaults to 100"
        action: "assert"
        target: "objective"
        asserts:
          kpi_portion:
            type: "value"
            expected: 100.0
          kpi_score:
            type: "value"
            expected: 70.0
          child_score:
            type: "value"
            expected: 0.0
          score:
            type: "value"
            expected: 70.0
      - step: "Plan without category has no range"
        action: "assert"
        target: "objective"
        asserts:
          score_category_range_id:
            type: "value"
            operator: "is_falsy"

