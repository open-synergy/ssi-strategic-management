  - name: "Overriding an automatic value needs a dissenting note"
    steps:
      - step: "Create KPI Override KPI"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_count.id"
          name: "Override KPI"
          weight: 100.0
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: "EVAL: (datetime.now() - relativedelta(days=30)).date()"
          date_end: "EVAL: (datetime.now() + relativedelta(days=30)).date()"
          target: 100.0
      - step: "Create overridden measurement"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m_over"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: "EVAL: datetime.now().date()"
          mode: "auto"
          automatic_value: 7.0
          manual_value: 5.0
          override_automatic: true
          dissenting_note: "Known data error"
      - step: "Create plain automatic measurement"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m_plain"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: "EVAL: datetime.now().date()"
          mode: "auto"
          automatic_value: 7.0
          manual_value: 5.0
      - step: "Create manual measurement"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m_manual"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: "EVAL: datetime.now().date()"
          manual_value: 3.0
      - step: "Create overridden measurement without a note"
        action: "create"
        model: "strategy_kpi.measurement"
        as_user: "validator"
        expect_error:
          type: "ValidationError"
          message_contains:
            "A dissenting note is required when overriding an automatic value."
        values:
          target_id: "REC: t1.id"
          date: "EVAL: datetime.now().date()"
          mode: "auto"
          automatic_value: 7.0
          manual_value: 5.0
          override_automatic: true
      - step: "Check m_over"
        action: "assert"
        target: "m_over"
        refresh: true
        asserts:
          value:
            type: "value"
            expected: 5.0
      - step: "Check m_plain"
        action: "assert"
        target: "m_plain"
        refresh: true
        asserts:
          value:
            type: "value"
            expected: 7.0
      - step: "Check m_manual"
        action: "assert"
        target: "m_manual"
        refresh: true
        asserts:
          value:
            type: "value"
            expected: 3.0

  - name: "Invalid realization configurations are rejected"
    steps:
      - step: "Create aggregate measure without a date field"
        action: "create"
        model: "strategy_measure"
        as_user: "validator"
        expect_error:
          type: "ValidationError"
          message_contains:
            "Aggregate measures require a model, a date field and, except for count, a
            value field."
        values:
          name: "Realization invalid measure"
          code: "EVAL: 'RI%s' % datetime.now().strftime('%H%M%S%f')"
          realization_method: "aggregate"
          aggregate_model_id: "REC: model_emp.id"
      - step: "Create sum measure without a value field"
        action: "create"
        model: "strategy_measure"
        as_user: "validator"
        expect_error:
          type: "ValidationError"
          message_contains: "Aggregate measures require a model"
        values:
          name: "Realization invalid sum measure"
          code: "EVAL: 'RJ%s' % datetime.now().strftime('%H%M%S%f')"
          realization_method: "aggregate"
          aggregate_model_id: "REC: model_emp.id"
          aggregate_date_field_id: "REC: f_create.id"
          aggregate_function: "sum"
      - step: "Create ratio measure without a denominator"
        action: "create"
        model: "strategy_measure"
        as_user: "validator"
        expect_error:
          type: "ValidationError"
          message_contains: "Ratio measures require a denominator model"
        values:
          name: "Realization invalid ratio measure"
          code: "EVAL: 'RK%s' % datetime.now().strftime('%H%M%S%f')"
          realization_method: "aggregate"
          aggregate_model_id: "REC: model_emp.id"
          aggregate_date_field_id: "REC: f_create.id"
          use_ratio: true
      - step: "Create parent objective"
        action: "create"
        model: "strategy_objective"
        save_as: "objective_parent"
        as_user: "validator"
        values:
          plan_id: "REC: plan.id"
          department_id: "REC: dept.id"
          perspective_id: "REF: ssi_strategic_management.strategy_perspective_financial"
      - step: "Create KPI Parent KPI"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_parent"
        as_user: "validator"
        values:
          objective_id: "REC: objective_parent.id"
          measure_id: "REC: measure_manual.id"
          name: "Parent KPI"
          weight: 100.0
      - step: "Create KPI whose parent KPI is on the same objective"
        action: "create"
        model: "strategy_kpi"
        as_user: "validator"
        expect_error:
          type: "ValidationError"
          message_contains: "The parent KPI must belong to the parent objective."
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_manual.id"
          name: "Wrong child"
          weight: 100.0
          parent_kpi_id: "REC: kpi_parent.id"

  - name: "The cron queues one job per running automatic target of its frequency"
    steps:
      - step: "Create quarterly measure"
        action: "create"
        model: "strategy_measure"
        save_as: "measure_quarter"
        as_user: "validator"
        values:
          name: "Realization quarterly measure"
          code: "EVAL: 'RQ%s' % datetime.now().strftime('%H%M%S%f')"
          frequency: "quarterly"
          realization_method: "python"
          python_code: "result = 1.0"
      - step: "Create monthly python measure"
        action: "create"
        model: "strategy_measure"
        save_as: "measure_month"
        as_user: "validator"
        values:
          name: "Realization monthly measure"
          code: "EVAL: 'RO%s' % datetime.now().strftime('%H%M%S%f')"
          frequency: "monthly"
          realization_method: "python"
          python_code: "result = 1.0"
      - step: "Create quarterly objective"
        action: "create"
        model: "strategy_objective"
        save_as: "objective_quarter"
        as_user: "validator"
        values:
          plan_id: "REC: plan.id"
          department_id: "REC: dept.id"
          perspective_id: "REF: ssi_strategic_management.strategy_perspective_financial"
      - step: "Create KPI Monthly KPI"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_month"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_month.id"
          name: "Monthly KPI"
          weight: 100.0
      - step: "Create KPI Quarterly KPI"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_quarter"
        as_user: "validator"
        values:
          objective_id: "REC: objective_quarter.id"
          measure_id: "REC: measure_quarter.id"
          name: "Quarterly KPI"
          weight: 100.0
      - step: "Create target t_month"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t_month"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_month.id"
          date_start: "EVAL: (datetime.now() - relativedelta(days=30)).date()"
          date_end: "EVAL: (datetime.now() + relativedelta(days=30)).date()"
          target: 100.0
      - step: "Create target t_quarter"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t_quarter"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_quarter.id"
          date_start: "EVAL: (datetime.now() - relativedelta(days=30)).date()"
          date_end: "EVAL: (datetime.now() + relativedelta(days=30)).date()"
          target: 100.0
      - step: "Start objective"
        action: "call"
        target: "objective"
        method: "action_open"
        as_user: "validator"
        context:
          bypass_policy_check: true
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Start objective_quarter"
        action: "call"
        target: "objective_quarter"
        method: "action_open"
        as_user: "validator"
        context:
          bypass_policy_check: true
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Run the monthly cron"
        action: "call"
        target: "t_month"
        method: "_cron_compute_realization"
        args:
          - "monthly"
      - step: "A job is queued for the monthly target"
        action: "search"
        model: "queue.job"
        domain:
          - ["method_name", "=", "action_compute_realization"]
          - [
              "func_string",
              "=",
              "EVAL: repr(registry['t_month']) + '.action_compute_realization()'",
            ]
        save_as: "job_month"
        expect_count: 1
      - step: "No job is queued for the quarterly target"
        action: "search"
        model: "queue.job"
        domain:
          - ["method_name", "=", "action_compute_realization"]
          - [
              "func_string",
              "=",
              "EVAL: repr(registry['t_quarter']) + '.action_compute_realization()'",
            ]
        save_as: "job_quarter"
        expect_count: 0
