      - step: "Create KPI Last"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_last"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Last"
          weight: 25.0
          aggregation: "last"
      - step: "Create target t_sum"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t_sum"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_sum.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement ms1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ms1"
        as_user: "validator"
        values:
          target_id: "REC: t_sum.id"
          date: 2026-02-01
          manual_value: 30.0
      - step: "Create measurement ms2"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ms2"
        as_user: "validator"
        values:
          target_id: "REC: t_sum.id"
          date: 2026-02-02
          manual_value: 40.0
      - step: "Sum"
        action: "assert"
        target: "t_sum"
        asserts:
          realization:
            type: "value"
            expected: 70.0
      - step: "Create target t_avg"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t_avg"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_avg.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement ma1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ma1"
        as_user: "validator"
        values:
          target_id: "REC: t_avg.id"
          date: 2026-02-01
          manual_value: 30.0
      - step: "Create measurement ma2"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ma2"
        as_user: "validator"
        values:
          target_id: "REC: t_avg.id"
          date: 2026-02-02
          manual_value: 40.0
      - step: "Average"
        action: "assert"
        target: "t_avg"
        asserts:
          realization:
            type: "value"
            expected: 35.0
      - step: "Create target t_last"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t_last"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi_last.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement ml1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ml1"
        as_user: "validator"
        values:
          target_id: "REC: t_last.id"
          date: 2026-02-20
          manual_value: 25.0
      - step: "Create measurement ml2"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "ml2"
        as_user: "validator"
        values:
          target_id: "REC: t_last.id"
          date: 2026-02-01
          manual_value: 10.0
      - step: "Last value by date"
        action: "assert"
        target: "t_last"
        asserts:
          realization:
            type: "value"
            expected: 25.0

  - name: "Target without measurement has zero realization"
    steps:
      - step: "Create KPI Empty"
        action: "create"
        model: "strategy_kpi"
