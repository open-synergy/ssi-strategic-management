  - name: "Target proposes the default target of the KPI"
    steps:
      - step: "Create KPI Default"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Default"
          weight: 100.0
          target: 42.0
      - step: "Create target without target value"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
      - step: "Target value is copied"
        action: "assert"
        target: "t1"
        asserts:
          target:
            type: "value"
            expected: 42.0

  - name: "OKR plan scores on a scale of 0.0 to 1.0"
    steps:
      - step: "Create KPI Key result"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective_okr.id"
          measure_id: "REC: measure_high.id"
          name: "Key result"
          weight: 100.0
          is_key_result: true
          key_result_type: "committed"
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 1.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 0.7
      - step: "Score is expressed on the OKR scale"
        action: "assert"
        target: "t1"
        asserts:
          score:
            type: "value"
            expected: 0.7
      - step: "Create target t2"
