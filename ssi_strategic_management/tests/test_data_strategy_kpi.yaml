          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "No realization"
        action: "assert"
        target: "t1"
        asserts:
          realization:
            type: "value"
            expected: 0.0
          score:
            type: "value"
            expected: 0.0
      - step: "No score on the KPI"
        action: "assert"
        target: "kpi"
        asserts:
