setup:
  steps:
    - step: "Create validator user"
      action: "create"
      model: "res.users"
      save_as: "validator"
      values:
        name: "Strategy KPI Validator"
        login: "EVAL: 'kpv%s' % datetime.now().strftime('%H%M%S%f')"
        groups_id:
          - [
              6,
              0,
              [
                "REF: base.group_user",
                "REF: ssi_strategic_management.strategy_plan_validator_group",
                "REF: ssi_strategic_management.strategy_objective_validator_group",
                "REF: ssi_strategic_management.strategy_measure_group",
              ],
            ]
    - step: "Create department"
      action: "create"
      model: "hr.department"
      save_as: "dept"
      values:
        name: "KPI Department"
    - step: "Create Balanced Scorecard plan type"
      action: "create"
      model: "strategy_plan_type"
      save_as: "type_bsc"
      as_user: "base.user_admin"
      values:
        name: "KPI plan type bsc"
        code: "EVAL: 'KB%s' % datetime.now().strftime('%H%M%S%f')"
        methodology: "bsc"
        cascade_level: "department"
    - step: "Create OKR plan type"
      action: "create"
      model: "strategy_plan_type"
      save_as: "type_okr"
      as_user: "base.user_admin"
      values:
        name: "KPI plan type okr"
        code: "EVAL: 'KO%s' % datetime.now().strftime('%H%M%S%f')"
        methodology: "okr"
        score_scale: "okr"
        cascade_level: "department"
    - step: "Create Balanced Scorecard plan"
      action: "create"
      model: "strategy_plan"
      save_as: "plan_bsc"
      as_user: "validator"
      values:
        title: "Test plan title"
        type_id: "REC: type_bsc.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
    - step: "Create OKR plan"
      action: "create"
      model: "strategy_plan"
      save_as: "plan_okr"
      as_user: "validator"
      values:
        title: "Test plan title"
        type_id: "REC: type_okr.id"
        date_start: 2026-01-01
        date_end: 2026-12-31
    - step: "Create Balanced Scorecard objective"
      action: "create"
      model: "strategy_objective"
      save_as: "objective"
      as_user: "validator"
      values:
        title: "Test objective title"
        plan_id: "REC: plan_bsc.id"
        department_id: "REC: dept.id"
        perspective_id: "REF: ssi_strategic_management.strategy_perspective_financial"
    - step: "Create OKR objective"
      action: "create"
      model: "strategy_objective"
      save_as: "objective_okr"
      as_user: "validator"
      values:
        title: "Test objective title"
        plan_id: "REC: plan_okr.id"
        department_id: "REC: dept.id"
    - step: "Create higher is better measure"
      action: "create"
      model: "strategy_measure"
      save_as: "measure_high"
      as_user: "validator"
      values:
        name: "KPI measure higher"
        code: "EVAL: 'MH%s' % datetime.now().strftime('%H%M%S%f')"
        polarity: "higher"
        aggregation: "sum"
    - step: "Create lower is better measure with score ranges"
      action: "create"
      model: "strategy_measure"
      save_as: "measure_low"
      as_user: "validator"
      values:
        name: "KPI measure lower"
        code: "EVAL: 'ML%s' % datetime.now().strftime('%H%M%S%f')"
        uom_label: "pcs"
        polarity: "lower"
        aggregation: "avg"
        score_min: 10.0
        score_max: 120.0
        score_range_ids:
          - [0, 0, {min_value: 0.0, max_value: 50.0, score: 60.0}]
          - [0, 0, {min_value: 50.01, max_value: 100.0, score: 100.0}]

scenarios:
  - name: "Higher is better KPI scores realization against target"
    steps:
      - step: "Create KPI Revenue"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Revenue"
          weight: 50.0
          target: 200.0
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 200.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 150.0
      - step: "Target realization and scores"
        action: "assert"
        target: "t1"
        asserts:
          realization:
            type: "value"
            expected: 150.0
          score:
            type: "value"
            expected: 75.0
          final_score:
            type: "value"
            expected: 37.5
      - step: "KPI takes the score of the measured target"
        action: "assert"
        target: "kpi"
        asserts:
          score:
            type: "value"
            expected: 75.0

  - name: "Higher is better KPI with a zero target scores zero"
    steps:
      - step: "Create KPI Zero target"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Zero target"
          weight: 100.0
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 0.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 10.0
      - step: "Score is zero"
        action: "assert"
        target: "t1"
        asserts:
          score:
            type: "value"
            expected: 0.0

  - name: "Lower is better KPI scores target over realization"
    steps:
      - step: "Create KPI Cost"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_low.id"
          name: "Cost"
          weight: 100.0
      - step: "KPI inherits the definition of the measure"
        action: "assert"
        target: "kpi"
        asserts:
          polarity:
            type: "value"
            expected: "lower"
          score_method:
            type: "value"
            expected: "lower"
          aggregation:
            type: "value"
            expected: "avg"
          uom_label:
            type: "value"
            expected: "pcs"
          score_min:
            type: "value"
            expected: 10.0
          score_max:
            type: "value"
            expected: 120.0
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 10.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 20.0
      - step: "Realization above target halves the score"
        action: "assert"
        target: "t1"
        asserts:
          score:
            type: "value"
            expected: 50.0
      - step: "Create target t2"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t2"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-04-01
          date_end: 2026-06-30
          target: 10.0
      - step: "Create measurement m2"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m2"
        as_user: "validator"
        values:
          target_id: "REC: t2.id"
          date: 2026-05-15
          manual_value: 5.0
      - step: "Score is clamped to the maximum score"
        action: "assert"
        target: "t2"
        asserts:
          score:
            type: "value"
            expected: 120.0
      - step: "Create target t3"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t3"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-07-01
          date_end: 2026-09-30
          target: 10.0
      - step: "Create measurement m3"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m3"
        as_user: "validator"
        values:
          target_id: "REC: t3.id"
          date: 2026-08-15
          manual_value: 0.0
      - step: "Zero realization earns the maximum score"
        action: "assert"
        target: "t3"
        asserts:
          score:
            type: "value"
            expected: 120.0

  - name: "Score is clamped to the minimum score"
    steps:
      - step: "Create KPI Clamp low"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Clamp low"
          weight: 100.0
          score_min: 20.0
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 5.0
      - step: "Score is raised to the minimum score"
        action: "assert"
        target: "t1"
        asserts:
          score:
            type: "value"
            expected: 20.0

  - name: "Within range KPI uses the matching score range"
    steps:
      - step: "Create KPI Range"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Range"
          weight: 100.0
          polarity: "range"
          score_range_ids:
            - [0, 0, {min_value: 0.0, max_value: 50.0, score: 60.0}]
            - [0, 0, {min_value: 50.01, max_value: 100.0, score: 100.0}]
      - step: "Score method follows the polarity"
        action: "assert"
        target: "kpi"
        asserts:
          score_method:
            type: "value"
            expected: "range"
      - step: "Create target t1"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t1"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-01-01
          date_end: 2026-03-31
          target: 100.0
      - step: "Create measurement m1"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m1"
        as_user: "validator"
        values:
          target_id: "REC: t1.id"
          date: 2026-02-15
          manual_value: 70.0
      - step: "Second range matches"
        action: "assert"
        target: "t1"
        asserts:
          score:
            type: "value"
            expected: 100.0
      - step: "Create target t2"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t2"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-04-01
          date_end: 2026-06-30
          target: 100.0
      - step: "Create measurement m2"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m2"
        as_user: "validator"
        values:
          target_id: "REC: t2.id"
          date: 2026-05-15
          manual_value: 20.0
      - step: "First range matches"
        action: "assert"
        target: "t2"
        asserts:
          score:
            type: "value"
            expected: 60.0
      - step: "Create target t3"
        action: "create"
        model: "strategy_kpi.target"
        save_as: "t3"
        as_user: "validator"
        values:
          kpi_id: "REC: kpi.id"
          date_start: 2026-07-01
          date_end: 2026-09-30
          target: 100.0
      - step: "Create measurement m3"
        action: "create"
        model: "strategy_kpi.measurement"
        save_as: "m3"
        as_user: "validator"
        values:
          target_id: "REC: t3.id"
          date: 2026-08-15
          manual_value: 500.0
      - step: "No range matches"
        action: "assert"
        target: "t3"
        asserts:
          score:
            type: "value"
            expected: 0.0

  - name: "Realization follows the aggregation of the KPI"
    steps:
      - step: "Create KPI Sum"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_sum"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
          name: "Sum"
          weight: 50.0
          aggregation: "sum"
      - step: "Create KPI Average"
        action: "create"
        model: "strategy_kpi"
        save_as: "kpi_avg"
        as_user: "validator"
        values:
          objective_id: "REC: objective.id"
          measure_id: "REC: measure_high.id"
